name: Supabase keep-alive backup

# Backstop for the Vercel Cron entries in vercel.json. It lives outside Vercel on
# purpose: if anything on the Vercel side ever stops the daily ping, these runs
# still register database activity, and GitHub emails you when a run fails.
#
# Read-only: it only calls GET /api/keepalive, which runs one aggregate count on
# `shipments` and returns nothing about any shipment.
#
# Requires one repository secret named CRON_SECRET:
#   repo -> Settings -> Secrets and variables -> Actions -> New repository secret
# The secret is never written into this file, so it stays private on a public repo.

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  # Lets you run it by hand from the Actions tab to test the setup.
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the keep-alive endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          code=$(curl -sS -o body.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://www.arcbestlogistics.com/api/keepalive)

          echo "HTTP $code"
          cat body.json
          echo

          if [ "$code" != "200" ]; then
            echo "::error::Keep-alive ping failed with HTTP $code — Supabase is not being kept active by this job."
            exit 1
          fi

          echo "Database activity registered."
